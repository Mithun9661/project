<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile Card with Hamburger Menu</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background: linear-gradient(135deg, #3a1c71, #d76d77, #ffaf7b);
      background-size: 300% 300%;
      animation: gradientAnimation 10s ease infinite;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }

    @keyframes gradientAnimation {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .container {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
    }

    .card {
      background: rgba(255, 255, 255, 0.9);
      border-radius: 15px;
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
      padding: 20px;
      width: 300px;
      transform: translateZ(0);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      position: relative;
    }

    .card:hover {
      transform: translateY(-10px) scale(1.05);
      box-shadow: 0 20px 30px rgba(0, 0, 0, 0.4);
    }

    .card h2 {
      margin-top: 0;
      color: #3a1c71;
    }

    .profile .menu {
      position: absolute;
      top: 20px;
      right: 20px;
      cursor: pointer;
      width: 25px;
      height: 25px;
    }

    .profile .menu div {
      width: 100%;
      height: 4px;
      background: #333;
      margin: 4px 0;
      border-radius: 2px;
    }

    .profile .dropdown {
      display: none;
      position: absolute;
      top: 50px;
      right: 20px;
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
      width: 150px;
      z-index: 1000;
    }

    .profile .dropdown a {
      display: block;
      padding: 10px;
      text-decoration: none;
      color: #333;
      font-size: 14px;
      border-bottom: 1px solid #eee;
    }

    .profile .dropdown a:last-child {
      border-bottom: none;
    }

    .profile .dropdown a:hover {
      background: #f4f4f4;
    }

    .profile .interests {
      list-style: none;
      padding: 0;
    }

    .profile .interests li {
      background: #e8f5e9;
      border-radius: 4px;
      padding: 5px;
      margin: 5px 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Profile Card -->
    <div class="card profile">
      <!-- Hamburger Menu -->
      <div class="menu" onclick="toggleDropdown()">
        <div></div>
        <div></div>
        <div></div>
      </div>
      <!-- Dropdown Menu -->
      <div class="dropdown" id="dropdownMenu">
        <a href="https://www.instagram.com" target="_blank">Instagram</a>
        <a href="https://www.whatsapp.com" target="_blank">WhatsApp</a>
        <a href="#contact">Contact</a>
      </div>
      <h2>My Profile</h2>
      <p><strong>Username:</strong>Mithun-Kumar</p>
      <p><strong>Email:</strong> mithunk9899@gmail.com</p>
      <p><strong>Location:</strong> Bihar India</p>
      <p><strong>Age:</strong> 20</p>
      <p><strong>Interests:</strong></p>
      <ul class="interests">
        <li>Technology</li>
        <li>Gaming</li>
        <li>Traveling</li>
      </ul>
    </div>
  </div>

  <script>
    function toggleDropdown() {
      const dropdown = document.getElementById('dropdownMenu');
      if (dropdown.style.display === 'block') {
        dropdown.style.display = 'none';
      } else {
        dropdown.style.display = 'block';
      }
    }
  </script>
</body>
</html>
